<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunk: #eef0f3; --ink: #1c2230; --muted: #667085; --line: #dfe3e8;
  --me: #d9480f; --me-soft: #fff1ea; --wait: #7a8599; --wait-soft: #eef1f5; --done: #2b8a5e; --done-soft: #e8f6ef;
  --link: #1d5fd1; --mine-bubble: #f3f6fd; --focus: #1d5fd1;
  --sans: "Pretendard", "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "JetBrains Mono", "D2Coding", "Noto Sans Mono CJK KR", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13161b; --surface: #1b1f26; --sunk: #232831; --ink: #e5e8ee; --muted: #98a2b3; --line: #2d333d;
  --me: #ff8a5c; --me-soft: #3a2219; --wait: #98a2b3; --wait-soft: #262b34; --done: #4cc38a; --done-soft: #1c3329;
  --link: #7aa7ff; --mine-bubble: #1f2738; --focus: #7aa7ff;
} }
:root[data-theme="dark"] {
  --bg: #13161b; --surface: #1b1f26; --sunk: #232831; --ink: #e5e8ee; --muted: #98a2b3; --line: #2d333d;
  --me: #ff8a5c; --me-soft: #3a2219; --wait: #98a2b3; --wait-soft: #262b34; --done: #4cc38a; --done-soft: #1c3329;
  --link: #7aa7ff; --mine-bubble: #1f2738; --focus: #7aa7ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 5px 12px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--me); border-color: var(--me); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }

/* 왼쪽: 세션별 묶음 — 작업마다 내 차례 질문 머리를 미리 보여 준다 */
.app { display: grid; grid-template-columns: clamp(320px, 24vw, 440px) 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; display: flex; flex-direction: column; }
.side-head { position: sticky; top: 0; background: var(--surface); z-index: 2; display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: .02em; }
.side-head .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
.grp { border-bottom: 1px solid var(--line); }
.grp-head { width: 100%; border: 0; border-radius: 0; background: none; display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; font-weight: 650; text-align: left; }
.grp-head:hover { background: var(--sunk); }
.grp-head .chev { color: var(--muted); width: 12px; flex: none; transition: transform .12s; }
.grp-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.grp-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp-head .n { color: var(--muted); font-weight: 400; font-size: 12px; }
.grp-body { padding: 0 8px 8px; display: grid; gap: 4px; }
.grp-head[aria-expanded="false"] + .grp-body { display: none; }
.grp-head.pc { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--sunk); }
.grp-head.pc[aria-expanded="false"] + .pc-body { display: none; }
.answer-link { display: inline-block; font-weight: 600; color: var(--link); text-decoration: none; padding: 6px 0; }
.answer-link:hover { text-decoration: underline; }
.trow { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; background: none; padding: 8px 10px;
  display: grid; gap: 3px; }
.trow:hover { background: var(--sunk); }
.trow.on { background: var(--me-soft); border-color: color-mix(in srgb, var(--me) 40%, var(--line)); }
.trow .top { display: flex; gap: 8px; align-items: flex-start; }
.trow .tt { flex: 1; font-weight: 600; font-size: 14px; line-height: 1.4; }
.trow .asks { margin: 0; padding: 0 0 0 16px; list-style: none; display: grid; gap: 1px; }
.trow .asks li { font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .asks li.more { color: var(--muted); }
.trow .when { font-size: 11.5px; color: var(--muted); padding-left: 16px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; margin-top: 6px; }
.dot.me { background: var(--me); }
.dot.txt { background: transparent; border: 1.5px solid var(--wait); }
.count { background: var(--me); color: #fff; border-radius: 9px; font-size: 12px; padding: 0 7px; font-weight: 700;
  font-variant-numeric: tabular-nums; flex: none; }
#doneBtn { margin: 12px 14px; align-self: flex-start; }
#main { overflow-y: auto; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } aside { max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); } #main { overflow: visible; } }

.page { max-width: 1200px; margin: 0 auto; padding: 20px 16px 80px; }
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
h1 { font-size: 22px; line-height: 1.35; margin: 4px 0 6px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.me { background: var(--me-soft); color: var(--me); }
.pill.claude { background: var(--wait-soft); color: var(--wait); }
.pill.done { background: var(--done-soft); color: var(--done); }
.banner { background: var(--me-soft); color: var(--ink); border: 1px solid var(--me); border-radius: 8px; padding: 8px 12px;
  margin: 12px 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; }

.md { overflow-wrap: anywhere; }
.md h2 { font-size: 17px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.md h3 { font-size: 15px; }
.md pre { background: var(--sunk); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.md code { font-family: var(--mono); font-size: .92em; background: var(--sunk); padding: 1px 4px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--line); padding: 4px 10px; }
.mermaid { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; text-align: center; }

/* 질문 카드 */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; }
.item.me { border-color: color-mix(in srgb, var(--me) 55%, var(--line)); }
.item > .head { display: flex; gap: 10px; align-items: baseline; padding: 12px 16px 0; }
.item .qid { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .qt { font-weight: 650; flex: 1; }
.item .body { padding: 4px 16px 0; }
.thread { display: grid; gap: 8px; padding: 8px 16px 0; }
.say { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.say .who { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 3px; }
.say .txt { border-radius: 8px; padding: 6px 10px; background: var(--sunk); }
.say.me .txt { background: var(--mine-bubble); }
.say.me .who { color: var(--link); }
.say .txt p { margin: 0 0 4px; } .say .txt p:last-child { margin: 0; }
.answer { padding: 10px 16px 14px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.thumbs:empty { display: none; }
.thumbs img { height: 72px; border: 1px solid var(--line); border-radius: 6px; }
textarea { width: 100%; min-height: 64px; resize: vertical; font: 14px/1.55 var(--sans); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea:focus { border-color: var(--focus); outline: none; }
textarea.raw { font: 13px/1.55 var(--mono); min-height: 70vh; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.row .hint { color: var(--muted); font-size: 12px; margin-right: auto; }
.row .ok { color: var(--done); font-size: 12px; }
details.reopen > summary { color: var(--muted); font-size: 13px; cursor: pointer; padding: 6px 16px 12px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.list button { display: flex; width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  padding: 10px 14px; gap: 12px; text-align: left; background: none; align-items: baseline; }
.list button:last-child { border-bottom: 0; }
.list .when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list .who { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .grp-head .chev { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside aria-label="세션별 작업">
    <div class="side-head"><span class="brand">Task Board</span><span id="total"></span><span class="sub" id="sub"></span></div>
    <div id="groups"></div>
    <button id="doneBtn" type="button">끝난 작업</button>
  </aside>
  <main id="main"><div class="page" id="page"><p class="empty">불러오는 중…</p></div></main>
</div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.flat().filter(k => k != null)); return e; };
const theme = document.documentElement.dataset.theme, dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
marked.setOptions({ breaks: true });   // 세션은 txt 처럼 줄 단위로 쓴다 — 줄바꿈을 그대로
mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'loose' });

let tasks = [], cur = null, view = 'task', drafts = {}, stale = false;

// 아티팩트로 열린 경우(window.BOARD) — 두 가지:
//  · 세션 한 장(R.mode === 'session'): board push 가 그 세션의 진행 중 작업을 심는다. [보내기] = Claude 에게 보내기 → 이 아티팩트를 올린 그 세션만 깬다.
//  · 목록(R.mode === 'hub'): 각 세션이 db tasks 에 쓴 줄을 실시간으로 읽는다. 왼쪽 PC·세션 목록과 내용은 PC 화면과 같고, 답은 작업 아티팩트에서.
const R = window.BOARD || null;
const HUB = R && R.mode === 'hub';
let hubReady = null;
if (HUB) hubReady = new Promise(done => {
  const fail = msg => { $('#page').replaceChildren(h('p', { className: 'empty', textContent: msg })); done(); };
  const timer = setTimeout(() => fail('목록을 못 불러왔습니다 — 잠시 뒤 다시 열어 주세요.'), 10000);
  (window.claude ? claude.use('db') : Promise.resolve(null)).then(db => {
    if (!db) { clearTimeout(timer); return fail('이 화면에선 목록을 읽을 수 없습니다(claude.ai 로그인 필요).'); }
    db.collection('tasks').onSnapshot(snap => {
      clearTimeout(timer);
      R.tasks = []; R.details = {};
      for (const d of snap.docs) {
        const r = d.data() || {};
        const t = { id: d.id, kind: 'task', title: r.title || r.task, session: r.session || '', pc: r.pc || '?', status: r.status || '진행 중',
          mine: r.mine || 0, waiting: r.waiting || 0, asks: r.asks || [], url: r.url || '', mtime: r.updated || 0 };
        R.tasks.push(t); R.details[d.id] = { ...t, blocks: r.blocks || [] };
      }
      done(); if (cur) refreshList();
    }, e => { clearTimeout(timer); fail('목록을 못 읽었습니다: ' + (e && e.message || e)); });
  });
});
let comments = null, assets = null;
if (R && window.claude) { claude.use('comments').then(c => comments = c); claude.use('assets').then(a => assets = a); }
const why = { no_session: '이 세션이 지금 꺼져 있습니다', writers_only: '편집 권한이 있어야 보낼 수 있습니다', off: '이 화면에선 보내기가 꺼져 있습니다' };
const bytes = t => new TextEncoder().encode(t).length;
async function relay(tid, item, text, send) {
  if (!comments) throw new Error('이 화면에선 보낼 수 없습니다(댓글 권한)');
  const body = `[board ${send ? 'send' : 'save'}] ${tid} ${item}\n${text}`;
  if (bytes(body) > 4000) throw new Error('너무 깁니다(한 번에 약 1,300자까지) — 나눠서 보내 주세요');
  const anchor = await comments.anchorFor(document.getElementById('q-' + item) || $('#page'));
  const leave = () => comments.create({ anchor, text: body });   // 세션이 꺼졌을 때 — 그냥 댓글로 남기면 세션이 다시 올릴 때 읽는다
  const can = await comments.canSendToClaude().catch(() => 'off');
  if (can !== 'available') throw Object.assign(new Error(can === 'no_session' ? '이 작업 세션이 지금 꺼져 있습니다' : (why[can] || can)), can === 'no_session' ? { leave } : {});
  try { await comments.sendToClaude({ anchor, text: body }); }
  catch (e) {
    if (e && e.code === 'rate_limited') throw new Error('너무 자주 보냈습니다 — 잠시 뒤 다시 보내 주세요(쓴 글은 남아 있습니다)');
    if (e && e.code === 'claude_unavailable') throw Object.assign(new Error('이 작업 세션이 지금 받을 수 없습니다'), { leave });
    throw e;
  }
  const d = R.details[tid];   // 다시 올라오기 전까지 내 말을 바로 보이게
  const b = d && d.blocks.find(b => (b.type === 'item' && b.id === item) || (b.type === 'memo' && item === '메모'));
  if (b) { b.entries.push({ who: 'me', text }); if (b.turn) b.turn = 'claude'; }
  return d;
}
async function remoteApi(path, body) {
  if (path === '/api/tasks') return R.tasks;
  if (path.startsWith('/api/task?id=')) { const d = R.details[decodeURIComponent(path.slice(13))]; if (!d) throw new Error('없음'); return d; }
  if (path === '/api/answer') return relay(body.id, body.item, body.text, !!body.send);
  throw new Error('PC 에서만 됩니다');
}

async function api(path, body) {
  if (R) return remoteApi(path, body);
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const when = t => { const d = new Date(t * 1000); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const shortSession = s => (s || '').replace(/\s*\[[0-9a-f]+\]$/, '');

function md(text, tid) {
  const box = h('div', { className: 'md' });
  box.innerHTML = marked.parse(text || '');
  box.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (/^(https?:|data:|\/)/.test(src)) return;
    if (!R) { img.src = `/files/${encodeURIComponent(tid)}/${src}`; return; }
    if ((R.images || {})[tid + '/' + src]) img.src = R.images[tid + '/' + src];
    else img.replaceWith(h('span', { className: 'pill claude', textContent: HUB ? '사진 — 작업 아티팩트에서 보기' : '사진(커서 못 실음) — PC 에서 보기' }));
  });
  box.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const div = h('div', { className: 'mermaid', textContent: code.textContent });
    code.parentElement.replaceWith(div);
  });
  return box;
}
function drawMermaid() { const n = [...document.querySelectorAll('.mermaid:not([data-processed])')]; if (n.length) mermaid.run({ nodes: n }).catch(() => {}); }

const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let folded = store.get('board.folded', {});   // 세션별로 사용자가 접고 편 것 — 없으면 내 차례가 있으면 펼침

function groups() {
  const open = tasks.filter(t => t.status !== '끝'), by = new Map();
  for (const t of open) {
    const key = t.kind === 'txt' ? 'txt' : (HUB ? t.pc + ' · ' : '') + (t.session || '세션 미상');
    if (!by.has(key)) by.set(key, { key, pc: t.pc, name: key === 'txt' ? 'txt 문서 (옛 형식)' : shortSession(t.session || '세션 미상'), ref: (key.match(/\[([0-9a-f]+)\]$/) || [])[1] || '', items: [] });
    by.get(key).items.push(t);
  }
  const gs = [...by.values()];
  for (const g of gs) {
    g.items.sort((a, b) => b.mine - a.mine || b.mtime - a.mtime);
    g.mine = g.items.reduce((n, t) => n + t.mine, 0);
    g.last = Math.max(...g.items.map(t => t.mtime));
  }
  return gs.sort((a, b) => (a.key === 'txt') - (b.key === 'txt') || b.mine - a.mine || b.last - a.last);
}
function taskRow(t) {
  const on = (view === 'task' || view === 'raw') && cur && cur.id === t.id;
  const asks = (t.asks || []).slice(0, 3);
  const more = (t.asks || []).length - asks.length;
  const b = h('button', { type: 'button', className: 'trow' + (on ? ' on' : ''), title: t.title },
    h('div', { className: 'top' }, h('span', { className: 'dot ' + (t.kind === 'txt' ? 'txt' : t.mine ? 'me' : '') }),
      h('span', { className: 'tt', textContent: t.title }), t.mine ? h('span', { className: 'count', textContent: t.mine }) : null),
    asks.length ? h('ul', { className: 'asks' }, asks.map(q => h('li', { textContent: q, title: q })),
      more > 0 ? h('li', { className: 'more', textContent: `외 ${more}개` }) : null) : null,
    h('div', { className: 'when', textContent: when(t.mtime) + (t.unread && !t.listening ? ' · ⚠ 보냈는데 세션이 안 듣는 중' : t.mine ? '' : t.waiting ? ' · 세션이 반영 중' : ' · 내 차례 없음') }));
  b.onclick = () => open(t.id);
  return b;
}
function grpHead(key, name, n, mine, isOpen, cls) {
  const head = h('button', { type: 'button', className: 'grp-head' + (cls ? ' ' + cls : ''), title: key },
    h('span', { className: 'chev', textContent: '▸' }), h('span', { className: 'name', textContent: name }),
    h('span', { className: 'n', textContent: n }), mine ? h('span', { className: 'count', textContent: mine }) : null);
  head.setAttribute('aria-expanded', String(isOpen));
  head.onclick = () => { folded[key] = isOpen; store.set('board.folded', folded); renderTabs(); };
  return head;
}
function renderTabs() {
  const box = $('#groups'); box.replaceChildren();
  if (HUB) {   // PC 마다 접히는 묶음 → 그 안에 세션 묶음(PC 화면과 같은 모양)
    const pcs = new Map();
    for (const g of groups()) { if (!pcs.has(g.pc)) pcs.set(g.pc, []); pcs.get(g.pc).push(g); }
    for (const [pc, gs] of pcs) {
      const mine = gs.reduce((n, g) => n + g.mine, 0), key = 'pc:' + pc;
      const isOpen = folded[key] === undefined ? true : !folded[key];
      const body = h('div', { className: 'pc-body' });
      for (const g of gs) {
        const gOpen = folded[g.key] === undefined ? g.mine > 0 : !folded[g.key];
        body.append(h('section', { className: 'grp' }, grpHead(g.key, g.name, g.items.length > 1 ? `작업 ${g.items.length}` : '', g.mine, gOpen), h('div', { className: 'grp-body' }, g.items.map(taskRow))));
      }
      box.append(h('section', { className: 'pc-grp' }, grpHead(key, 'PC ' + pc, `세션 ${gs.length}`, mine, isOpen, 'pc'), body));
    }
  } else for (const g of groups()) {
    const isOpen = folded[g.key] === undefined ? g.mine > 0 : !folded[g.key];
    const head = h('button', { type: 'button', className: 'grp-head', ariaExpanded: String(isOpen), title: g.key },
      h('span', { className: 'chev', textContent: '▸' }), h('span', { className: 'name', textContent: g.name }),
      h('span', { className: 'n', textContent: g.items.length > 1 ? `작업 ${g.items.length}` : '' }),
      g.mine ? h('span', { className: 'count', textContent: g.mine }) : null);
    head.setAttribute('aria-expanded', String(isOpen));
    head.onclick = () => { folded[g.key] = isOpen; store.set('board.folded', folded); renderTabs(); };
    box.append(h('section', { className: 'grp' }, head, h('div', { className: 'grp-body' }, g.items.map(taskRow))));
  }
  const done = tasks.filter(t => t.status === '끝').length;
  $('#doneBtn').textContent = `끝난 작업 ${done}`;
  const mine = tasks.filter(t => t.status !== '끝').reduce((n, t) => n + t.mine, 0);
  $('#total').replaceChildren(...(mine ? [h('span', { className: 'count', textContent: mine })] : []));
  $('#sub').textContent = (HUB ? `PC ${new Set(tasks.filter(t => t.status !== '끝').map(t => t.pc)).size} · ` : '') + `세션 ${groups().filter(g => g.key !== 'txt').length} · 작업 ${tasks.filter(t => t.status !== '끝').length}`;
  const name = R && R.mode === 'session' ? 'Task Board · ' + shortSession(R.session) : 'Task Board';
  document.title = mine ? `(${mine}) ${name}` : name;
}
function keepDrafts() { if (cur) store.set('board.drafts.' + cur.id, drafts); }
function sorted() { return groups().flatMap(g => g.items); }

async function refreshList() {
  try { tasks = await api('/api/tasks'); } catch { return; }
  renderTabs();
  if (view !== 'task' || !cur) return;
  const t = tasks.find(t => t.id === cur.id);
  if (t && t.mtime !== cur.mtime) {
    // 쓰는 중인 칸을 갈아엎지 않는다 — 칸을 벗어날 때 다시 그린다. 안 보낸 글은 drafts 로 살아남는다
    if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') stale = true;
    else await open(cur.id, true);
  }
}
document.addEventListener('focusout', e => { if (stale && e.target.tagName === 'TEXTAREA' && view === 'task') { stale = false; setTimeout(() => open(cur.id, true), 0); } });

async function open(id, keepScroll) {
  const y = $('#main').scrollTop;
  const prev = cur && cur.id;
  try { cur = await api('/api/task?id=' + encodeURIComponent(id)); } catch (e) { $('#page').replaceChildren(h('p', { className: 'empty', textContent: '없는 작업입니다.' })); return; }
  if (prev !== id || view !== 'task') drafts = store.get('board.drafts.' + id, {});
  view = 'task'; stale = false;
  if (location.hash.slice(1) !== encodeURIComponent(id)) history.replaceState(null, '', '#' + encodeURIComponent(id));
  renderTabs(); renderTask();
  $('#main').scrollTop = keepScroll ? y : 0;
}

function saveRow(onSave, onSend, hint, msg) {
  const ok = h('span', { className: 'ok', textContent: msg || '' });
  const save = h('button', { type: 'button', textContent: '저장', title: '문서에만 적습니다 — 세션은 안 깨웁니다' });
  const send = onSend ? h('button', { type: 'button', className: 'primary', textContent: '보내기', title: '저장하고 그 세션을 깨웁니다 — 세션이 읽고 반영' }) : null;
  const run = async (fn, label) => {
    try { await fn(); if (ok.isConnected) ok.textContent = label; }
    catch (e) {
      ok.textContent = '실패: ' + e.message;
      if (e.leave && !ok.nextElementSibling?.classList.contains('leave')) ok.after(h('button', { type: 'button', className: 'leave', textContent: '남겨 두기',
        title: '세션이 다시 켜져 이 작업을 다시 올릴 때 읽고 넣습니다',
        onclick: async ev => { ev.target.disabled = true; try { await e.leave(); ok.textContent = '남겼습니다 — 세션이 다시 켜지면 넣습니다'; ev.target.remove(); } catch (x) { ok.textContent = '실패: ' + x.message; ev.target.disabled = false; } } }));
    }
  };
  save.onclick = () => run(onSave, '저장됨');
  if (send) send.onclick = () => run(onSend, '보냄 —세션이 읽습니다');
  return { row: h('div', { className: 'row' }, h('span', { className: 'hint', textContent: hint }), ok, save, send), save, send };
}

function attachPaste(ta, tid) {
  const upload = async file => {
    let path;
    if (R) { if (!assets) return alertRow(ta, '이 화면에선 이미지를 올릴 수 없습니다'); path = (await assets.upload(file)).url; }
    else {
      const ext = (file.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
      const r = await fetch(`/api/image?id=${encodeURIComponent(tid)}&ext=${ext}`, { method: 'POST', body: file });
      path = (await r.json()).path;
    }
    const at = ta.selectionStart, snip = `![](${path})`;
    ta.value = ta.value.slice(0, at) + snip + ta.value.slice(ta.selectionEnd);
    ta.dispatchEvent(new Event('input'));
  };
  ta.addEventListener('paste', e => { const f = [...e.clipboardData.files].filter(f => f.type.startsWith('image/')); if (f.length) { e.preventDefault(); f.forEach(upload); } });
  ta.addEventListener('dragover', e => e.preventDefault());
  ta.addEventListener('drop', e => { const f = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')); if (f.length) { e.preventDefault(); f.forEach(upload); } });
  return upload;
}
function alertRow(ta, msg) { const ok = ta.parentElement && ta.parentElement.querySelector('.ok'); if (ok) ok.textContent = msg; }

const okMsg = {};
function thumbs(text, tid) {
  const paths = [...(text || '').matchAll(/!\[[^\]]*\]\(((?:img\/|https?:)[^)\s]+)\)/g)].map(m => m[1]);
  return h('div', { className: 'thumbs' }, paths.map(p => h('img', { src: /^https?:/.test(p) ? p : `/files/${encodeURIComponent(tid)}/${p}`, alt: '붙인 이미지' })));
}
function editor(key, value, tid, placeholder, onSave, onSend) {
  const ta = h('textarea', { value: drafts[key] ?? value, placeholder });
  const prev = tid ? thumbs(ta.value, tid) : h('div');
  ta.addEventListener('input', () => { drafts[key] = ta.value; keepDrafts(); if (tid) prev.replaceChildren(...thumbs(ta.value, tid).childNodes); });
  const upload = tid ? attachPaste(ta, tid) : null;
  const stamp = () => new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  const done = (fn, msg) => async () => { cur = await fn(ta.value); delete drafts[key]; keepDrafts(); okMsg[key] = `${msg} ${stamp()}`; await refreshList(); renderTask(); };
  const r = saveRow(done(onSave, '저장됨 — 대화에 올렸습니다'), onSend && done(onSend, '보냄 — 세션이 읽고 반영합니다'),
    tid ? (R ? '저장 = 문서에만 · 보내기 = 세션이 읽고 반영' : '저장 = 여기에만 · 보내기 = 세션이 읽고 반영 · 이미지 Ctrl+V · Ctrl+Enter 보내기') : '', okMsg[key]);
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && r.send) { e.preventDefault(); r.send.click(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); r.save.click(); }
  });
  if (R && upload) {   // 폰엔 붙여넣기가 불편하다 — 사진 고르기
    const pick = h('input', { type: 'file', accept: 'image/*', hidden: true });
    pick.onchange = () => [...pick.files].forEach(upload);
    r.row.insertBefore(h('button', { type: 'button', textContent: '사진', onclick: () => pick.click() }), r.save);
    r.row.append(pick);
  }
  return h('div', {}, ta, prev, r.row);
}

function thread(entries, tid) {
  return h('div', { className: 'thread' }, entries.map(e =>
    h('div', { className: 'say ' + e.who }, h('div', { className: 'who', textContent: e.who === 'me' ? '나' : '세션' }), h('div', { className: 'txt' }, md(e.text, tid)))));
}
function answerLink() {   // 목록에서 답하면 목록을 올린 세션이 깬다(=중계) — 답은 그 작업 세션이 올린 작업 아티팩트에서
  return cur && cur.url ? h('a', { className: 'answer-link', href: cur.url, target: '_blank', rel: 'noopener', textContent: '답하기 — 이 작업 아티팩트 열기 ↗' })
    : h('span', { className: 'pill claude', textContent: '세션이 아직 작업 아티팩트를 안 올렸습니다' });
}
function itemCard(b, tid) {
  const label = { me: '내 차례', claude: '세션 차례', done: '결정' }[b.turn];
  const card = h('section', { className: 'item ' + b.turn, id: 'q-' + b.id },
    h('div', { className: 'head' }, h('span', { className: 'qid', textContent: b.id }), h('span', { className: 'qt', textContent: b.title }),
      h('span', { className: 'pill ' + b.turn, textContent: label })));
  if (b.desc) card.append(h('div', { className: 'body' }, md(b.desc, tid)));
  if (b.entries.length) card.append(thread(b.entries, tid));
  const ed = HUB ? answerLink() : editor('q:' + b.id, '', tid, b.turn === 'claude' ? '덧붙일 말이 있으면 — 세션이 아직 반영 전입니다' : '답을 적어 주세요 — 추천대로면 "ㅇㅋ"',
    text => api('/api/answer', { id: tid, item: b.id, text }),
    text => api('/api/answer', { id: tid, item: b.id, text, send: true }));
  if (b.turn === 'done') card.append(h('details', { className: 'reopen' }, h('summary', { textContent: '다시 답하기' }), h('div', { className: 'answer' }, ed)));
  else card.append(h('div', { className: 'answer' }, ed));
  return card;
}

function renderTask() {
  const t = cur, main = $('#page');
  const doneNow = t.status === '끝';
  const head = h('div', { className: 'top' },
    h('div', {}, h('h1', { textContent: t.title }),
      h('div', { className: 'meta' },
        h('span', { className: 'pill ' + (doneNow ? 'done' : t.mine ? 'me' : 'claude'), textContent: doneNow ? '끝' : t.mine ? `내 차례 ${t.mine}` : t.kind === 'txt' ? 'txt 문서' : '세션 차례' }),
        h('span', { textContent: t.session }), h('span', { textContent: when(t.mtime) + ' 갱신' }),
        !R && t.unpushed ? h('span', { className: 'pill me', textContent: '아티팩트에 아직 안 올림', title: '세션이 board push 를 안 했습니다' }) : null)),
    h('div', { className: 'actions' }, ...(t.kind === 'task' && !R ? [
      h('button', { type: 'button', textContent: '원문 편집', onclick: () => renderRaw() }),
      h('button', { type: 'button', textContent: doneNow ? '다시 진행' : '끝으로', onclick: async () => { cur = await api('/api/status', { id: t.id, done: !doneNow }); await refreshList(); renderTask(); } }),
    ] : [])));
  const out = [head];
  if (R && R.mode === 'session' && R.hub) out.unshift(h('a', { href: R.hub, target: '_blank', rel: 'noopener', textContent: '← Task Board 목록(모든 PC·세션)' }));
  if (HUB) out.push(h('div', { className: 'banner' }, h('span', { textContent: `${t.pc} · ${shortSession(t.session)} — 세션이 질문·답을 쓸 때마다 바로 바뀝니다. 답은 각 질문의 '답하기'(작업 아티팩트)에서.` }),
    t.url ? h('a', { className: 'answer-link', href: t.url, target: '_blank', rel: 'noopener', textContent: '작업 아티팩트 ↗' }) : null));
  else if (R) {   // 세션이 문서를 고칠 때마다 다시 올린다. [최신으로] = 그 세션에게 다시 올려 달라는 요청
    const msg = h('span', { textContent: `PC ${R.pc} · ${shortSession(R.session)} 의 작업 — 문서 ${when(R.at)} 기준. 세션이 질문·답을 쓸 때마다 다시 올립니다.` });
    const btn = h('button', { type: 'button', textContent: '최신으로', title: '이 세션이 PC 문서로 다시 올립니다 — 세션이 다른 일 중이면 늦을 수 있음' });
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        if (!comments) throw new Error('이 화면에선 쓸 수 없습니다(댓글 권한)');
        const can = await comments.canSendToClaude().catch(() => 'off');
        if (can !== 'available') throw new Error(why[can] || can);
        await comments.sendToClaude({ anchor: await comments.anchorFor($('#page')), text: `[board sync] ${cur.id}\n최신으로 다시 올려 주세요` });
        msg.textContent = '요청했습니다 — 10~20초 뒤 화면이 새 내용으로 다시 열립니다.';
      } catch (e) { msg.textContent = '실패: ' + e.message; btn.disabled = false; }
    };
    out.push(h('div', { className: 'banner' }, msg, btn));
  }
  else if (t.kind === 'task' && !doneNow && !t.listening)
    out.push(h('div', { className: 'banner' }, h('span', { textContent: (t.unread ? '보낸 것이 아직 안 읽혔습니다 — ' : '') +
      '이 세션은 지금 듣고 있지 않아 [보내기]해도 바로 깨어나지 않습니다(PC 메모리가 모자라면 세션의 대기가 꺼집니다). 그 세션 채팅에 "Task Board 봐", 또는 아무 세션에 "Task Board 깨워 줘"라고 해 주세요.' })));
  if (t.kind === 'txt') {
    out.push(h('div', { className: 'banner' }, h('span', { textContent: '옛 txt 문서 — [보내기]가 없습니다. 저장한 뒤 그 세션에 "봐"라고 알려 주세요.' })));
    out.push(rawEditor(t));
  } else {
    for (const b of t.blocks) {
      if (b.type === 'md') out.push(md(b.text, t.id));
      else if (b.type === 'item') out.push(itemCard(b, t.id));
      else if (b.type === 'memo') {
        const card = h('section', { className: 'item', id: 'q-메모' }, h('div', { className: 'head' }, h('span', { className: 'qt', textContent: '질문과 상관없는 말 · 이미지' })));
        if (b.desc) card.append(h('div', { className: 'body' }, md(b.desc, t.id)));
        if (b.entries.length) card.append(thread(b.entries, t.id));
        card.append(h('div', { className: 'answer' }, HUB ? answerLink() : editor('memo', '', t.id, '세션에게 하고 싶은 말 — 텍스트·이미지',
          text => api('/api/answer', { id: t.id, item: '메모', text }), text => api('/api/answer', { id: t.id, item: '메모', text, send: true }))));
        out.push(card);
      }
    }
  }
  main.replaceChildren(...out);
  drawMermaid();
}

function rawEditor(t) {
  const ta = h('textarea', { className: 'raw', value: drafts.raw ?? t.raw, spellcheck: false });
  ta.addEventListener('input', () => { drafts.raw = ta.value; keepDrafts(); });
  const r = saveRow(async () => {
    cur = await api('/api/raw', { id: t.id, text: ta.value, mtime: cur.mtime }); delete drafts.raw; keepDrafts(); await refreshList();
  }, null, 'Ctrl+S 저장 · 그사이 세션이 고쳤으면 저장이 거절됩니다');
  ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); r.save.click(); } });
  return h('div', {}, ta, r.row);
}
function renderRaw() {
  view = 'raw';
  $('#page').replaceChildren(h('div', { className: 'top' }, h('h1', { textContent: cur.title + ' — 원문' }),
    h('div', { className: 'actions' }, h('button', { type: 'button', textContent: '돌아가기', onclick: () => open(cur.id) }))), rawEditor(cur));
}

function renderDone() {
  view = 'done'; renderTabs();
  const done = tasks.filter(t => t.status === '끝').sort((a, b) => b.mtime - a.mtime);
  $('#page').replaceChildren(h('h1', { textContent: '끝난 작업' }),
    done.length ? h('div', { className: 'list' }, done.map(t => h('button', { type: 'button', onclick: () => open(t.id) },
      h('span', { className: 'when', textContent: when(t.mtime) }), h('span', { textContent: t.title }), h('span', { className: 'who', textContent: shortSession(t.session) }))))
      : h('p', { className: 'empty', textContent: '아직 없습니다.' }));
}
$('#doneBtn').onclick = renderDone;
if (R) $('#doneBtn').hidden = true;   // 바깥 화면엔 진행 중 작업만 싣는다

(async () => {
  if (hubReady) await hubReady;
  tasks = await api('/api/tasks');
  const want = decodeURIComponent(location.hash.slice(1));
  const first = tasks.find(t => t.id === want) || sorted()[0];
  if (first) await open(first.id); else { renderTabs(); $('#page').replaceChildren(h('p', { className: 'empty', textContent: '올라온 작업이 없습니다.' })); }
  if (!R) setInterval(refreshList, 2000);
})();
// 보는 중 신호 — 이 창이 보이고 포커스일 때만. 서버는 12초 안에 신호가 있으면 PC 알림을 안 띄운다
function beat() { if (R) return; if (document.visibilityState === 'visible' && document.hasFocus()) fetch('/api/presence', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {}); }
setInterval(beat, 5000); addEventListener('focus', beat); document.addEventListener('visibilitychange', beat); beat();
addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && (!cur || id !== cur.id)) open(id); });
</script>
</body>
</html>
